replicaCount: 1

image:
  repository: your-org/message-queue
  tag: latest
  pullPolicy: IfNotPresent

service:
  grpcPort: 50051
  httpPort: 8080

config:
  partitionCount: 256
  dataDir: /data/mq
  retentionHours: 24
  heartbeatTimeoutSec: 15
  maxGroupMembers: 10
  maxPartitionSize: 100000
  logLevel: info

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1Gi

persistence:
  enabled: true
  size: 10Gi
  storageClass: ""

metrics:
  enabled: true
  path: /metrics
  port: 8080

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80
