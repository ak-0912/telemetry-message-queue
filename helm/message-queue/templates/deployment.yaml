apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "message-queue.fullname" . }}
  labels:
    {{- include "message-queue.labels" . | nindent 4 }}
spec:
  replicas: {{ if .Values.autoscaling.enabled }}{{ .Values.autoscaling.minReplicas }}{{ else }}{{ .Values.replicaCount }}{{ end }}
  selector:
    matchLabels:
      {{- include "message-queue.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "message-queue.selectorLabels" . | nindent 8 }}
      {{- if .Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "{{ .Values.metrics.port }}"
        prometheus.io/path: "{{ .Values.metrics.path }}"
      {{- end }}
    spec:
      containers:
        - name: message-queue
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.grpcPort }}
            - name: http
              containerPort: {{ .Values.service.httpPort }}
          env:
            - name: MQ_GRPC_PORT
              value: "{{ .Values.service.grpcPort }}"
            - name: MQ_HTTP_PORT
              value: "{{ .Values.service.httpPort }}"
            - name: MQ_PARTITION_COUNT
              value: "{{ .Values.config.partitionCount }}"
            - name: MQ_DATA_DIR
              value: {{ .Values.config.dataDir | quote }}
            - name: MQ_RETENTION_HOURS
              value: "{{ .Values.config.retentionHours }}"
            - name: MQ_HEARTBEAT_TIMEOUT_SEC
              value: "{{ .Values.config.heartbeatTimeoutSec }}"
            - name: MQ_MAX_GROUP_MEMBERS
              value: "{{ .Values.config.maxGroupMembers }}"
            - name: MQ_MAX_PARTITION_SIZE
              value: "{{ .Values.config.maxPartitionSize }}"
            - name: MQ_FETCH_BATCH_DEFAULT
              value: "{{ .Values.config.fetchBatchDefault }}"
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: mq-data
              mountPath: {{ .Values.config.dataDir }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: mq-data
          persistentVolumeClaim:
            claimName: {{ include "message-queue.fullname" . }}-pvc
      {{- end }}
