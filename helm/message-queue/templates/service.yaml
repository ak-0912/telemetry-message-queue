apiVersion: v1
kind: Service
metadata:
  name: {{ include "message-queue.fullname" . }}
  labels:
    {{- include "message-queue.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "message-queue.selectorLabels" . | nindent 4 }}
  ports:
    - name: grpc
      port: {{ .Values.service.grpcPort }}
      targetPort: grpc
    - name: http
      port: {{ .Values.service.httpPort }}
      targetPort: http
