version: '3.9'

services:
  telemetry-message-queue:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      MQ_DATA_DIR: /workspaces/${localWorkspaceFolderBasename}/data/mq
      MQ_GRPC_PORT: "50051"
      MQ_HTTP_PORT: "8080"
      # Used by cmd/telemetry-collector (see envOr in main.go). gRPC must reach a running mq-server.
      MQ_GRPC_ADDR: "127.0.0.1:50051"
      MQ_GROUP: "telemetry-collector"
      MQ_TOPIC: "gpu-telemetry"
    volumes:
      - ..:/workspaces/${localWorkspaceFolderBasename}:cached
    # Dev container stays up for local development; mq-server is not started automatically.
    # Run: go run ./cmd/server   or   make run   (then collector can dial MQ_GRPC_ADDR).
    command: sleep infinity
    # mq-server still listens on 8080 inside the container; host 9002 avoids clashing with
    # api-gateway (or anything else) already bound to host :8080 in the same environment.
    ports:
      - "50051:50051"
      - "9002:8080"
